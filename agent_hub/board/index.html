<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#17171c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233182f6'/%3E%3Cpath d='M9 16.5l5 5 9-10' fill='none' stroke='%23fff' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>Board</title>
<style>
/* ---- tokens (light) ---- */
:root{
  color-scheme:light;
  --bg:#f2f4f6; --surface:#ffffff; --surface-2:#f9fafb; --surface-3:#f2f4f6;
  --line:#e5e8eb; --line-2:#d1d6db;
  --text:#191f28; --text-2:#4e5968; --text-3:#6b7684; --text-4:#b0b8c1;
  --blue:#3182f6; --blue-dn:#1b64da; --blue-weak:#e8f3ff; --blue-ink:#1b64da;
  --red:#f04452; --red-weak:#ffeeee; --red-ink:#d22030;
  --green:#03b26c; --green-weak:#f0faf6; --green-ink:#028a54;
  --orange:#fe9800; --orange-weak:#fff3e0; --orange-ink:#c85400;
  --teal:#18a5a5; --teal-weak:#edf8f8; --teal-ink:#0a7474;
  --grey-weak:#f2f4f6; --grey-ink:#4e5968;
  --press:rgba(2,32,71,.05); --scrim:rgba(0,0,0,.48);
  --toast-bg:rgba(51,61,75,.96); --toast-fg:#ffffff; --surface-t:rgba(255,255,255,0);
  --media:#0f1115;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px;
  --r-xs:8px; --r-s:12px; --r:16px; --r-l:20px;
  --t2:22px; --t3:20px; --t4:17px; --t5:15px; --t6:13px;
  --fs:16px; --tap:44px; --col:720px;
  --nav-h:calc(60px + env(safe-area-inset-bottom));
  --chat-h:68px;
  --shadow:0 -8px 32px rgba(2,32,71,.10);
  --ease:cubic-bezier(.2,.8,.2,1);
}
/* ---- tokens (dark) ---- */
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --bg:#17171c; --surface:#202027; --surface-2:#26262e; --surface-3:#2c2c35;
  --line:#33333d; --line-2:#4d4d59;
  --text:#ffffff; --text-2:#c3c3c6; --text-3:#9e9ea4; --text-4:#62626d;
  --blue:#3485fa; --blue-dn:#2272eb; --blue-weak:#202c4d; --blue-ink:#64a8ff;
  --red:#f04251; --red-weak:rgba(240,66,81,.18); --red-ink:#fb8890;
  --green:#15c47e; --green-weak:rgba(21,196,126,.16); --green-ink:#3fd599;
  --orange:#ffa927; --orange-weak:rgba(255,169,39,.16); --orange-ink:#ffbd51;
  --teal:#30b6b6; --teal-weak:rgba(48,182,182,.16); --teal-ink:#58c7c7;
  --grey-weak:#2c2c35; --grey-ink:#b0b0b6;
  --press:rgba(255,255,255,.06); --scrim:rgba(0,0,0,.66);
  --toast-bg:rgba(228,228,229,.97); --toast-fg:#191f28; --surface-t:rgba(32,32,39,0);
  --media:#0b0b0e; --shadow:0 -8px 32px rgba(0,0,0,.5);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:var(--fs)/1.5 "Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
body.locked,body.sheet-open{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;min-height:var(--tap)}
textarea,input{font:inherit;color:inherit}
a{color:var(--blue-ink)}
h1,h2,h3,h4,p{margin:0}
.hidden{display:none!important}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.pressable{cursor:pointer;transition:transform .12s var(--ease),background-color .12s}
.pressable:active{transform:scale(.985);background-image:linear-gradient(var(--press),var(--press))}

/* ---- header ---- */
#top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
#top .in{max-width:var(--col);margin:0 auto;padding:4px var(--s5) 10px}
#top .r1{display:flex;align-items:center;gap:var(--s2);min-height:var(--tap)}
#brand{font-size:var(--t4);font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#top .sp{flex:1}
#me{font-size:var(--t6);color:var(--text-3);font-weight:600;white-space:nowrap;max-width:40vw;overflow:hidden;text-overflow:ellipsis}
#signout{padding:0 var(--s2);color:var(--text-3);font-size:var(--t6);font-weight:600;border-radius:var(--r-xs);white-space:nowrap}
#off{flex:none}
#strip{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:2px calc(-1 * var(--s5)) 0;padding:0 var(--s5)}
#strip::-webkit-scrollbar{display:none}
.lp{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:14px;background:var(--grey-weak);color:var(--text-2);font-size:var(--t6);font-weight:600;white-space:nowrap;flex:none}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;background:var(--text-4)}
.dot.busy{background:var(--blue);animation:beat 1.6s ease-in-out infinite}
.dot.asking{background:var(--orange)}
.dot.idle{background:var(--text-4)}
.dot.closed{background:transparent;box-shadow:inset 0 0 0 1.5px var(--text-4)}
.dot.unknown{background:transparent;box-shadow:inset 0 0 0 1.5px var(--red)}
@keyframes beat{50%{opacity:.35}}

/* ---- layout ---- */
main{max-width:var(--col);margin:0 auto;padding:var(--s5) var(--s5) calc(var(--nav-h) + var(--chat-h) + var(--s7))}
/* ---- pinned chat: the same request box on every tab ---- */
#chat{position:fixed;left:0;right:0;bottom:var(--nav-h);z-index:19;background:var(--bg);border-top:1px solid var(--line)}
#chat .in{max-width:var(--col);margin:0 auto;padding:var(--s2) var(--s5);display:grid;gap:var(--s1)}
#chat-last{display:block;width:100%;text-align:left;font-size:var(--t6);line-height:1.4;color:var(--text-2);background:var(--blue-weak);border-radius:var(--r-s);padding:6px var(--s3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chat .row{display:flex;gap:var(--s2);align-items:flex-end}
#chat textarea{flex:1;min-width:0;height:var(--tap);max-height:120px;border:0;outline:none;resize:none;background:var(--surface);border-radius:var(--r-s);padding:12px var(--s4);font-size:var(--fs);line-height:1.3}
#chat textarea::placeholder{color:var(--text-4)}
#chat textarea:focus{box-shadow:inset 0 0 0 1.5px var(--blue)}
body.has-last{--chat-h:104px}
.btn-s{height:var(--tap);padding:0 var(--s5);border-radius:var(--r-s);background:var(--blue);color:#fff;font-weight:700;font-size:var(--t5);transition:opacity .15s,transform .12s}
.btn-s:disabled{opacity:.35;cursor:default}
.btn-s:active:not(:disabled){transform:scale(.97);background:var(--blue-dn)}
.note::placeholder,.field::placeholder{color:var(--text-4)}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#nav .in{max-width:var(--col);margin:0 auto;display:flex}
#nav button{flex:1;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-4);font-size:11px;font-weight:600;position:relative;transition:color .15s}
#nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:var(--text)}
.badge{position:absolute;top:6px;left:calc(50% + 5px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center}

/* ---- sections ---- */
.sec{margin-bottom:var(--s7)}
.sec-h{display:flex;align-items:center;gap:var(--s2);margin:0 0 var(--s3);padding:0 var(--s1);font-size:var(--t3);font-weight:700;letter-spacing:-.01em;line-height:1.4}
.sec-h h2{font:inherit}
.sec-h .n{color:var(--text-3);font-weight:600;font-size:var(--t4)}
.sec-h .ext{margin-left:auto;display:flex;align-items:center;gap:var(--s2)}
.cap{color:var(--text-3);font-weight:600;font-size:var(--t5);font-variant-numeric:tabular-nums}
.cap.full{color:var(--orange-ink)}
.empty{color:var(--text-3);font-size:var(--t5);padding:var(--s6) var(--s5);background:var(--surface);border-radius:var(--r-l);text-align:center}
.stack,.grid{display:grid;gap:var(--s3);grid-template-columns:minmax(0,1fr)}
.stack>*,.grid>*{min-width:0}
@media (min-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---- chips ---- */
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:var(--r-xs);font-size:var(--t6);font-weight:600;background:var(--grey-weak);color:var(--grey-ink);white-space:nowrap;line-height:1;flex:none}
.chip.lane{background:var(--blue-weak);color:var(--blue-ink)}
.chip.ask,.chip.st-asking,.chip.v-hold,.chip.m-wait,.chip.paused{background:var(--orange-weak);color:var(--orange-ink)}
.chip.st-busy,.chip.t-running,.chip.v-answer{background:var(--blue-weak);color:var(--blue-ink)}
.chip.st-closed{color:var(--text-3)}
.chip.st-unknown,.chip.rk-blocked,.chip.v-no,.chip.t-cancelled{background:var(--red-weak);color:var(--red-ink)}
.chip.rk-done,.chip.v-ok,.chip.t-closed,.chip.m-replied{background:var(--green-weak);color:var(--green-ink)}
.chip.rk-handoff,.chip.rk-wrapped,.chip.t-wrapping{background:var(--teal-weak);color:var(--teal-ink)}
.meta{display:flex;align-items:center;gap:var(--s2);font-size:var(--t6);color:var(--text-3);flex-wrap:wrap;line-height:1.4;min-width:0}
.meta .t{margin-left:auto;font-variant-numeric:tabular-nums}

/* ---- cards ---- */
.card{display:block;width:100%;text-align:left;background:var(--surface);border-radius:var(--r-l);padding:var(--s4) var(--s5);overflow:hidden}
.card .title{font-size:var(--t4);font-weight:700;line-height:1.4;margin:var(--s2) 0 2px;letter-spacing:-.01em}
.card .esc{color:var(--text-2);font-size:var(--t5);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px}
.card .foot{margin-top:var(--s3);display:flex;align-items:center;gap:var(--s3);font-size:var(--t6);color:var(--text-3);min-height:20px}
.card .foot .go{margin-left:auto;color:var(--text-4);display:inline-flex}
.chev{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none;color:var(--text-4);transition:transform .2s var(--ease)}
.chev.up{transform:rotate(90deg)}
.strip{display:flex;gap:var(--s2);margin-top:var(--s3);overflow-x:auto;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip img{height:88px;width:auto;max-width:160px;object-fit:cover;border-radius:var(--r-s);background:var(--media);flex:none}
.strip .more{height:88px;min-width:56px;border-radius:var(--r-s);background:var(--surface-3);display:flex;align-items:center;justify-content:center;color:var(--text-2);font-size:var(--t5);font-weight:600;flex:none}
.doing{display:flex;gap:var(--s3);align-items:flex-start;background:var(--surface);border-radius:var(--r-l);padding:var(--s4) var(--s5);margin-bottom:var(--s6)}
.doing.busy,.doing.asking{background:var(--blue-weak)}
.doing .dot{margin-top:8px}
.doing .k{font-size:var(--t6);font-weight:600;color:var(--text-3)}
.doing.busy .k{color:var(--blue-ink)}
.doing .tx{font-size:var(--t5);font-weight:600;line-height:1.5}
.doing .tx.none{font-weight:500;color:var(--text-3)}

/* ---- rows ---- */
.list{background:var(--surface);border-radius:var(--r-l);overflow:hidden}
.row{display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;padding:var(--s3) var(--s5);min-height:64px;position:relative}
.row+.row::before{content:"";position:absolute;left:var(--s5);right:var(--s5);top:0;border-top:1px solid var(--line)}
.row .body{flex:1;min-width:0}
.row .title{font-weight:600;font-size:var(--t5);line-height:1.45}
.row .sub{font-size:var(--t6);color:var(--text-3);margin-top:2px;line-height:1.45}
.fold{display:flex;align-items:center;gap:var(--s2);width:100%;text-align:left;padding:0 var(--s5);min-height:56px;font-size:var(--t5);font-weight:600;color:var(--text-2)}
.fold .nm{flex:1}
.fold+.row::before{content:"";position:absolute;left:var(--s5);right:var(--s5);top:0;border-top:1px solid var(--line)}
.seg{display:flex;gap:2px;padding:3px;margin:0 0 var(--s4);background:var(--grey-weak);border-radius:var(--r-s);overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;height:38px;min-height:38px;padding:0 var(--s2);border-radius:9px;color:var(--text-3);font-size:var(--t6);font-weight:600;white-space:nowrap;transition:background-color .15s,color .15s}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(2,32,71,.10)}
.seg .n{margin-left:4px;font-weight:500;color:var(--text-4);font-variant-numeric:tabular-nums}
.see-all{display:flex;align-items:center;justify-content:center;width:100%;margin-top:var(--s3);min-height:48px;border-radius:var(--r);background:var(--surface);color:var(--text-2);font-size:var(--t5);font-weight:600}
.see-all:disabled{color:var(--text-4);cursor:default}

/* ---- lanes / reports / memos ---- */
.kvs{display:grid;gap:4px;margin:var(--s2) 0}
.kv{display:flex;gap:var(--s3);font-size:var(--t5);line-height:1.5}
.kv .k{color:var(--text-3);min-width:64px;flex:none}
.stages{display:flex;flex-wrap:wrap;gap:6px;margin:var(--s2) 0}
.stg{padding:4px 8px;border-radius:var(--r-xs);background:var(--grey-weak);color:var(--grey-ink);font-size:var(--t6);font-weight:600}
.seg{display:flex;gap:6px;overflow-x:auto;margin:0 0 var(--s4);padding:0 var(--s1);scrollbar-width:none}
.seg button{height:36px;padding:0 14px;border-radius:18px;background:var(--surface);color:var(--text-2);font-weight:600;font-size:var(--t5);white-space:nowrap;flex:none}
.seg button.on{background:var(--blue);color:#fff}
.chip.rt-green,.stg.rt-green{background:var(--green-weak);color:var(--green-ink)}
.chip.rt-blue,.stg.rt-blue{background:var(--blue-weak);color:var(--blue-ink)}
.chip.rt-amber,.stg.rt-amber{background:var(--orange-weak);color:var(--orange-ink)}
.chip.rt-red,.stg.rt-red{background:var(--red-weak);color:var(--red-ink)}
.stg.weak{box-shadow:inset 0 0 0 1.5px var(--orange)}
.pl .stages{margin:0}
#v-engine .days{margin-bottom:var(--s6)}
.stg.now{background:var(--blue-weak);color:var(--blue-ink)}
.days{display:flex;gap:6px;align-items:flex-end;height:72px}
.day{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;font-size:var(--t6);color:var(--text-3)}
.day i{display:block;width:100%;min-height:2px;background:var(--blue-weak);border-radius:3px 3px 0 0}
.row.static{cursor:default}
.sb>.tk{font-size:var(--t5);font-weight:600;line-height:1.45;margin:var(--s2) 0}
.sb>.tk .id{color:var(--text-3);font-weight:500;margin-right:4px}
.lc{text-align:left;width:100%;cursor:pointer;background:var(--surface);border-radius:var(--r-l);padding:var(--s4) var(--s5);display:grid;gap:6px;align-content:start}
.lc .hd{display:flex;align-items:center;gap:var(--s2);min-width:0}
.lc .nm{font-weight:700;font-size:var(--t4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lc .hd .chip:last-child{margin-left:auto}
.lc .tk{font-size:var(--t5);font-weight:600;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lc .tk .id{color:var(--text-3);font-weight:500;margin-right:4px}
.lc .tk.none{font-weight:500;color:var(--text-3)}
.lc .dg{font-size:var(--t6);color:var(--text-2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rep{background:var(--surface);border-radius:var(--r-l);padding:var(--s4) var(--s5)}
.rep .txt{font-size:var(--t5);line-height:1.55;margin-top:var(--s2);white-space:pre-wrap;cursor:pointer}
.rep .txt.clip{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.att{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s3)}
.att a{font-size:var(--t6);color:var(--blue-ink);font-weight:600;text-decoration:none;background:var(--blue-weak);padding:0 10px;border-radius:var(--r-xs);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-flex;align-items:center;min-height:var(--tap)}
.att button{min-height:0;border-radius:var(--r-xs);overflow:hidden}
.att img{height:72px;display:block;background:var(--media)}
.sent{display:grid;gap:var(--s2)}
.sent .m{background:var(--surface);border-radius:var(--r);padding:var(--s4) var(--s5);font-size:var(--t5);line-height:1.55}
.sent .tx{white-space:pre-wrap;margin-top:6px}
.sent .reply{margin-top:var(--s3);padding:var(--s3) var(--s4);border-radius:var(--r-s);background:var(--blue-weak)}
.sent .reply .prose{margin:4px 0 0;font-size:var(--t5)}
.sent .reply .prose p:last-child{margin-bottom:0}
.clip-h{max-height:8.4em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent);mask-image:linear-gradient(#000 60%,transparent)}
.more-tog{display:block;min-height:36px;color:var(--text-3);font-size:var(--t6);font-weight:600;margin-top:2px}

#sheet-bd{position:fixed;inset:0;z-index:29;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s}
#sheet-bd.open{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;margin:0 auto;max-width:var(--col);max-height:calc(100vh - 12px);max-height:calc(100dvh - env(safe-area-inset-top) - 12px);background:var(--surface);border-radius:var(--r-l) var(--r-l) 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow);transform:translateY(105%);visibility:hidden;transition:transform .32s var(--ease),visibility 0s linear .32s}
#sheet.open{transform:none;visibility:visible;transition:transform .32s var(--ease)}
.sh{flex:none;position:relative;display:flex;align-items:center;gap:var(--s2);padding:14px var(--s2) 2px var(--s5);min-height:58px}
.grab{position:absolute;top:7px;left:50%;width:36px;height:4px;border-radius:2px;background:var(--line-2);transform:translateX(-50%)}
.sh .meta{flex:1}
.sh .x{width:var(--tap);height:var(--tap);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--text-3);flex:none}
.sh .x svg,#lb .x svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.sb{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:var(--s1) var(--s5) var(--s6)}
.cta{flex:none;position:relative;background:var(--surface);padding:var(--s2) var(--s5) calc(var(--s2) + env(safe-area-inset-bottom))}
.cta::before{content:"";position:absolute;left:0;right:0;top:-24px;height:24px;background:linear-gradient(to bottom,var(--surface-t),var(--surface));pointer-events:none}
.d-title{font-size:var(--t2);font-weight:700;line-height:1.35;letter-spacing:-.01em;margin:var(--s2) 0 var(--s4)}
.box{border-radius:var(--r);padding:var(--s4) var(--s5);font-size:var(--t5);line-height:1.55;margin-bottom:var(--s3);background:var(--surface-3);white-space:pre-wrap}
.box .k{display:block;font-size:var(--t6);font-weight:600;margin-bottom:4px;color:var(--text-3)}
.box.q{background:var(--orange-weak)}
.box.q .k{color:var(--orange-ink)}
.box.esc{background:var(--blue-weak)}
.box.esc .k{color:var(--blue-ink)}
.h3{font-size:var(--t5);color:var(--text-3);font-weight:600;margin:var(--s6) 0 var(--s2);padding:0 var(--s1);display:flex;gap:6px}
.h3 .n{color:var(--text-4);font-weight:500}
.verdict{display:flex;align-items:center;gap:var(--s3);padding:var(--s4) var(--s5);border-radius:var(--r);background:var(--surface-3);margin-bottom:var(--s3)}
.verdict .big{font-size:var(--t3);font-weight:700;line-height:1.3}
.verdict.v-ok .big{color:var(--green-ink)} .verdict.v-no .big{color:var(--red-ink)}
.verdict.v-hold .big{color:var(--orange-ink)} .verdict.v-answer .big{color:var(--blue-ink)}
.verdict .ch{font-weight:600;font-size:var(--t5);margin-top:2px}
.verdict .who{margin-left:auto;font-size:var(--t6);color:var(--text-3);text-align:right;line-height:1.5;flex:none}
.quote{background:var(--surface-3);border-radius:var(--r);padding:var(--s4) var(--s5)}
.quote .prose{margin:0;font-size:var(--t5)}
.quote .prose p:last-child{margin-bottom:0}

/* ---- markdown ---- */
.prose{font-size:var(--fs);line-height:1.65;margin:var(--s2) 0 var(--s5)}
.prose>:first-child{margin-top:0}
.prose p{margin:0 0 var(--s3)}
.prose h3{font-size:var(--t4);font-weight:700;margin:var(--s5) 0 var(--s2)}
.prose h4{font-size:var(--t5);font-weight:700;color:var(--text-2);margin:var(--s4) 0 var(--s1)}
.prose ul,.prose ol{margin:0 0 var(--s3);padding-left:1.3em}
.prose li{margin:3px 0}
.prose strong{font-weight:700}
.prose code{font:.88em ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface-3);border-radius:5px;padding:1px 5px}
.prose pre{margin:0 0 var(--s3);padding:var(--s3) var(--s4);background:var(--surface-3);border-radius:var(--r-s);overflow-x:auto;line-height:1.5}
.prose pre code{background:none;padding:0;font-size:var(--t6);white-space:pre}
.prose blockquote{margin:0 0 var(--s3);padding:var(--s3) var(--s4);background:var(--surface-2);border-radius:var(--r-s);color:var(--text-2);font-size:var(--t5)}
.box .prose,.quote .prose{white-space:normal}

/* ---- attachments ---- */
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s2)}
@media (min-width:600px){.gal{grid-template-columns:repeat(3,minmax(0,1fr))}}
.gal.one{grid-template-columns:1fr}
.gal .pic{display:block;width:100%;aspect-ratio:4/3;border-radius:var(--r-s);overflow:hidden;background:var(--media)}
.gal.one .pic{aspect-ratio:auto}
.gal img{display:block;width:100%;height:100%;object-fit:cover}
.gal.one img{max-height:60vh;object-fit:contain}
.vid{display:block;width:100%;max-height:60vh;border-radius:var(--r-s);background:var(--media);margin-top:var(--s2)}
.files{display:grid;gap:var(--s2);margin-top:var(--s2)}
.file{display:flex;align-items:center;gap:var(--s3);padding:0 var(--s4);background:var(--surface-3);border-radius:var(--r);color:var(--text);text-decoration:none;min-height:56px}
.file svg{width:22px;height:22px;stroke:var(--blue);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.file .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--t5);font-weight:500}
.file .ext{font-size:var(--t6);color:var(--text-3);text-transform:uppercase}

/* ---- options + note + buttons ---- */
.opts{display:grid;gap:var(--s2)}
.opt{display:flex;gap:var(--s3);align-items:center;text-align:left;width:100%;background:var(--surface-3);border-radius:var(--r);padding:var(--s3) var(--s4) var(--s3) var(--s5);min-height:60px;transition:background-color .15s}
.opt .tx{flex:1;min-width:0}
.opt .lb{display:block;font-weight:600;font-size:var(--t4);line-height:1.4}
.opt .ds{display:block;color:var(--text-2);font-size:var(--t5);margin-top:2px;line-height:1.45}
.opt .mk{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-2);background:var(--surface);flex:none;display:flex;align-items:center;justify-content:center;transition:background-color .15s,border-color .15s}
.opts.multi .opt .mk{border-radius:7px}
.opt .mk svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.6);transition:opacity .15s,transform .15s var(--ease)}
.opt.on{background:var(--blue-weak)}
.opt.on .lb{color:var(--blue-ink)}
.opt.on .mk{background:var(--blue);border-color:var(--blue)}
.opt.on .mk svg{opacity:1;transform:none}
.opt:disabled{cursor:default}
.opt.ro:not(.on){opacity:.5}
.note{display:block;width:100%;min-height:96px;background:var(--surface-3);border:1.5px solid transparent;border-radius:var(--r);padding:var(--s3) var(--s4);resize:vertical;font-size:var(--fs);line-height:1.5;outline:none;margin-top:var(--s5)}
.note:focus{border-color:var(--blue);background:var(--surface)}
.acts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:var(--s2)}
.acts.one{grid-template-columns:1fr}
.btn{height:56px;border-radius:var(--r);font-weight:600;font-size:var(--t5);display:flex;align-items:center;justify-content:center;gap:6px;background:var(--grey-weak);color:var(--text-2);padding:0 var(--s3);transition:opacity .15s,transform .12s}
.btn.primary{background:var(--blue);color:#fff;font-size:var(--t4);font-weight:700}
.btn.primary svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.btn:disabled{opacity:.38;cursor:default}
.btn:active:not(:disabled){transform:scale(.98)}
.btn.primary:active:not(:disabled){background:var(--blue-dn)}
.btn-text{grid-column:1 / -1;height:var(--tap);color:var(--text-3);font-size:var(--t5);font-weight:600;border-radius:var(--r-s)}
.btn-text:disabled{opacity:.4}

/* ---- lightbox ---- */
#lb{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.96);display:none;flex-direction:column;color:#fff;touch-action:pan-y}
#lb.open{display:flex}
#lb .lh{display:flex;align-items:center;padding:calc(env(safe-area-inset-top) + 4px) var(--s2) 4px var(--s5);font-size:var(--t5)}
#lb .cnt{flex:1;font-variant-numeric:tabular-nums;font-weight:600;color:rgba(255,255,255,.75)}
#lb .x{width:var(--tap);display:flex;align-items:center;justify-content:center;color:#fff}
#lb .stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative;padding:0 var(--s2)}
#lb .stage img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-select:none}
#lb .nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;display:none;align-items:center;justify-content:center}
#lb .nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#lb .nav.p{left:var(--s4)} #lb .nav.n{right:var(--s4)}
@media (hover:hover) and (pointer:fine){#lb .nav{display:flex}}
#lb .lf{padding:var(--s2) var(--s5) calc(var(--s3) + env(safe-area-inset-bottom));display:flex;align-items:center;gap:var(--s3);font-size:var(--t6)}
#lb .lf .nm{flex:1;color:rgba(255,255,255,.6);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lb .lf a{color:#fff;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;min-height:var(--tap)}

/* ---- login ---- */
#login{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:var(--s5)}
.login-card{width:100%;max-width:360px;background:var(--surface);border-radius:var(--r-l);padding:var(--s7) var(--s6) var(--s6);display:grid;gap:var(--s3)}
.login-card .logo{width:48px;height:48px;border-radius:14px;background:var(--blue-weak);color:var(--blue);display:flex;align-items:center;justify-content:center}
.login-card .logo svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.login-card h1{font-size:var(--t2);font-weight:700;margin:var(--s2) 0 var(--s3);letter-spacing:-.01em}
.field{height:56px;border-radius:var(--r);background:var(--surface-3);border:1.5px solid transparent;padding:0 var(--s4);font-size:var(--fs);outline:none;width:100%}
.field:focus{border-color:var(--blue);background:var(--surface)}

/* ---- toast ---- */
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--chat-h) + 16px);transform:translateX(-50%) translateY(8px);z-index:60;background:var(--toast-bg);color:var(--toast-fg);padding:14px 20px;border-radius:var(--r);font-size:var(--t5);font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s var(--ease);max-width:calc(100vw - 40px);width:max-content;text-align:center;line-height:1.4}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{background:var(--red);color:#fff}
body.sheet-open #toast{bottom:calc(150px + env(safe-area-inset-bottom))}
body.locked #toast{bottom:calc(24px + env(safe-area-inset-bottom))}

/* ---- header extras ---- */
#brand-btn{display:inline-flex;align-items:center;gap:2px;max-width:100%;min-width:0;font:inherit;border-radius:var(--r-xs);padding:0 2px 0 0}
#brand-btn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#brand-btn svg{width:18px;height:18px;stroke:var(--text-3);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#langbtn{padding:0 var(--s2);color:var(--text-3);font-size:var(--t6);font-weight:700;letter-spacing:.04em;border-radius:var(--r-xs);white-space:nowrap}
#stopped{flex:none}

.hint{font-size:var(--t6);color:var(--text-3);padding:var(--s2) var(--s1) 0;line-height:1.5}
.btn-text.warn{color:var(--red-ink)}

/* ---- menus (language, workspaces) ---- */
.sh .ttl{flex:1;font-size:var(--t4);font-weight:700}
.menu{display:grid;gap:var(--s2)}
.mrow{display:flex;align-items:center;gap:var(--s3);width:100%;text-align:left;background:var(--surface-3);border-radius:var(--r);padding:var(--s3) var(--s4);min-height:60px}
.mrow .body{flex:1;min-width:0}
.mrow .nm{font-weight:600;font-size:var(--t5);line-height:1.4}
.mrow .sub{font-size:var(--t6);color:var(--text-3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow.on{background:var(--blue-weak)}
.mrow.on .nm{color:var(--blue-ink)}
.mrow:disabled{opacity:.5;cursor:default}
.mrow .ck{width:20px;height:20px;stroke:var(--blue);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mrow .badge{position:static;flex:none}
.dot.on{background:var(--green)}

.reach{background:var(--orange-weak);border-radius:var(--r-l);padding:var(--s4) var(--s5);display:grid;gap:var(--s2)}
.reach .k{font-weight:700;font-size:var(--t5);color:var(--orange-ink)}
.reach .tx{font-size:var(--t5);color:var(--text-2);line-height:1.55}
.reach .bar{display:flex;justify-content:flex-end}

/* ---- lane cap stepper ---- */
.sec-h.wrap{flex-wrap:wrap;row-gap:var(--s2)}
.sec-h.wrap .ext{flex-wrap:wrap;justify-content:flex-end;row-gap:var(--s2)}
.step{display:inline-flex;align-items:center;gap:var(--s2)}
.step .stl{font-size:var(--t6);font-weight:600;color:var(--text-3);white-space:nowrap}
.step .pill{display:inline-flex;align-items:center;height:32px;border-radius:16px;background:var(--surface)}
.step button{width:var(--tap);height:var(--tap);min-height:var(--tap);margin:-6px 0;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--text-2)}
.step button:disabled{color:var(--text-4);cursor:default}
.step svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;transition:transform .12s var(--ease)}
.step button:active:not(:disabled) svg{transform:scale(.8)}
.step b{min-width:20px;text-align:center;font-size:var(--t5);font-weight:700;font-variant-numeric:tabular-nums}

/* ---- usage strip ---- */
#use{display:none;max-width:var(--col);margin:0 auto;height:26px;padding:0 var(--s5);align-items:center;gap:var(--s3);overflow-x:auto;scrollbar-width:none;white-space:nowrap;font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line)}
#use::-webkit-scrollbar{display:none}
body.has-use #use{display:flex}
body.has-use{--nav-h:calc(86px + env(safe-area-inset-bottom))}
#use .k{font-weight:700;color:var(--text-2)}
#use .r b{font-weight:600;color:var(--text-2);margin-right:4px}

/* ---- lane add ---- */
.ico{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.fold.add{color:var(--blue-ink)}
.la-wrap{margin-top:var(--s4)}
.la{display:grid;gap:var(--s4);padding:var(--s4) var(--s5) var(--s5);position:relative}
.la::before{content:"";position:absolute;left:var(--s5);right:var(--s5);top:0;border-top:1px solid var(--line)}
.la .two{display:grid;gap:var(--s4);grid-template-columns:minmax(0,1fr)}
@media (min-width:600px){.la .two{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fr{display:grid;gap:6px;align-content:start;min-width:0}
.fl{font-size:var(--t6);font-weight:600;color:var(--text-2);padding:0 var(--s1)}
.fh{font-size:var(--t6);color:var(--text-3);line-height:1.45;padding:0 var(--s1)}
.fh.err{color:var(--red-ink)}
.field[aria-invalid="true"]{border-color:var(--red)}
.la .seg{margin:0}
.la .note{margin:0;min-height:112px}
.la .bar{display:flex;justify-content:flex-end}
.la .hint{padding:0 var(--s1)}

/* ---- workspace extensions (window.dah) ---- */
#nav .in.x{overflow-x:auto;scrollbar-width:none}
#nav .in.x::-webkit-scrollbar{display:none}
#nav .in.x button{min-width:56px}
#nav .in.x button:focus-visible{outline-offset:-4px}
#nav .in.x button>span:not(.badge){max-width:100%;padding:0 var(--s1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x-err{background:var(--red-weak);border-radius:var(--r-l);padding:var(--s4) var(--s5);display:grid;gap:var(--s1)}
.x-err .k{display:flex;align-items:center;gap:var(--s2);font-size:var(--t5);font-weight:700;color:var(--red-ink)}
.x-err .tx{font:var(--t6)/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text-2);white-space:pre-wrap}

@media (min-width:760px){
  #sheet{bottom:24px;border-radius:var(--r-l);max-height:calc(100vh - 48px);transform:translateY(calc(100% + 32px))}
  .cta{border-radius:0 0 var(--r-l) var(--r-l);padding-bottom:var(--s4)}
}
@media (prefers-reduced-motion:reduce){*,*::before{transition:none!important;animation:none!important}}
</style>

<script>

    if (set.has(label)) set.delete(label); else set.add(label);
    d.picks = it.options.map(o => o.label).filter(l => set.has(l));
  }
  renderSheet(true);
}
function noteBox(it, d) {
  const ta = h('textarea', { class: 'note', id: 'note-' + it.id, rows: '3', placeholder: it.kind === 'decision' ? L.ph.answer : L.ph.review,
    'aria-label': L.label.note, disabled: !!S.busy[it.id] });
  ta.value = d.note;
  ta.addEventListener('input', () => {
    d.note = ta.value;
    const ans = $('#sheet [data-act=answer]');
    if (ans) ans.disabled = !!S.busy[it.id] || !d.note.trim();
  });
  return ta;
}
function ctaBlock(it, d) {
  const busy = !!S.busy[it.id];
  const hold = h('button', { class: 'btn-text', type: 'button', disabled: busy, onclick: () => decide(it, 'hold') }, L.btn.hold);
  if (it.kind === 'decision') {
    const n = picks(it, d).length;
    const ans = h('button', { class: 'btn', type: 'button', 'data-act': 'answer', disabled: busy || !d.note.trim(), onclick: () => decide(it, 'answer') }, L.btn.answer);
    const ok = h('button', { class: 'btn primary', type: 'button', disabled: busy || !n, onclick: () => decide(it, 'ok') },
      svg(ICON.check), n > 1 ? `${L.btn.decide} · ${n}` : L.btn.decide);
    return h('div', { class: 'acts' }, ans, ok, hold);
  }
  const done = h('button', { class: 'btn primary', type: 'button', disabled: busy, onclick: () => decide(it, d.note.trim() ? 'answer' : 'ok') }, svg(ICON.check), L.btn.done);
  return h('div', { class: 'acts one' }, done, hold);
}
async function decide(it, verdict) {
  const d = draft(it);
  if (S.busy[it.id]) return;
  if (verdict === 'answer' && it.kind === 'decision' && !d.note.trim()) return;
  if (verdict === 'ok' && it.kind === 'decision' && !picks(it, d).length) return;
  const body = { verdict, note: d.note.trim() };
  if (verdict === 'ok' && it.kind === 'decision') { if (it.multi) body.choices = d.picks; else body.choice = d.choice; }
  S.busy[it.id] = true; renderSheet(true);
  try {
    await post(BASE + `api/items/${it.id}/decide`, body);
    delete S.drafts[it.id]; delete S.extra[it.id]; S.busy[it.id] = false;
    toast(verdict === 'hold' ? L.msg.held : verdict === 'answer' ? L.msg.answered : it.kind === 'review' ? L.msg.reviewed : L.msg.decided);
    closeSheet();
    refresh();
  } catch (e) {
    S.busy[it.id] = false;
    if (e.status !== 401) toast(e.message, true);
    renderSheet(true);
  }
}
// ---------- history tab ----------
function resetHist(kind) { S.hist = { kind, rows: [], more: false, loading: false, loaded: false }; }
function viewHistory() {
  const v = $('#v-history'), d = D();
  shell(v, () => [h('div', { id: 'hs-seg' }), h('div', { id: 'hs-body' }), h('div', { id: 'hs-foot' })]);
  paint($('#hs-seg'), LANG + S.hist.kind + JSON.stringify(d.counts), () => h('div', { class: 'seg', role: 'tablist' }, HIST_KINDS.map(k =>
    h('button', { type: 'button', role: 'tab', class: k === S.hist.kind ? 'on' : '', 'aria-selected': String(k === S.hist.kind),
      onclick: () => { if (k !== S.hist.kind) { resetHist(k); render(); } } },
      L.hist[k], d.counts[k] !== undefined ? h('span', { class: 'n' }, d.counts[k]) : null))));
  if (!S.hist.loaded && !S.hist.loading) loadHist();
  paintHist();
}
function histRow(kind, r) {
  if (kind === 'decided') return decidedRow(r);
  if (kind === 'reports') return repCard(r);
  if (kind === 'closed') return taskRow(r);
  return memoRow(r);
}
function paintHist() {
  const H = S.hist, body = $('#hs-body'), foot = $('#hs-foot');
  if (!body) return;
  paint(body, tick() + H.kind + H.rows.length + H.loaded, () => {
    if (!H.rows.length) return H.loaded ? empty(L.empty.hist) : empty(L.empty.loading);
    const cls = { decided: 'list', closed: 'list', reports: 'stack', memos: 'sent', requests: 'sent' }[H.kind];
    return h('div', { class: cls }, H.rows.map(r => histRow(H.kind, r)));
  });
  paint(foot, LANG + H.kind + H.rows.length + H.more + H.loading + H.loaded, () => !H.loaded || !H.rows.length ? null : H.more
    ? h('button', { class: 'see-all', type: 'button', disabled: H.loading, onclick: () => loadHist() }, H.loading ? L.empty.loading : L.btn.more)
    : h('div', { class: 'empty', style: 'background:none' }, L.empty.end));
}
async function loadHist() {
  const H = S.hist;
  if (H.loading) return;
  H.loading = true; paintHist();
  try {
    const j = await get(BASE + `api/history?kind=${encodeURIComponent(H.kind)}&offset=${H.rows.length}`);
    if (S.hist !== H) return;  // switched kind meanwhile
    const rows = (j && j.rows) || [];
    if (H.kind === 'decided') for (const it of rows) S.extra[it.id] = it;
    H.rows.push(...rows); H.more = !!(j && j.more); H.loaded = true;
  } catch (e) {
    if (S.hist !== H) return;
    if (e.status !== 401) toast(e.message, true);
    H.loaded = true;
  }
  H.loading = false; paintHist();
}
function decidedRow(it) {
  return pressable('row', () => openItem(it.id),
    h('span', { class: 'chip v-' + (it.verdict || it.state) }, verdictLabel(it)),
    h('div', { class: 'body' }, h('div', { class: 'title' }, it.title),
      h('div', { class: 'sub' }, [laneLabel(it.lane), it.choice, it.decided_by, fmtT(it.decided)].filter(Boolean).join(' · '))),
    svg(ICON.chev, 'chev'));
}

// ---------- login ----------
function needLogin() {
  if (S.auth) return;
  S.auth = true;
  closeLb();
  const inp = h('input', { class: 'field', type: 'password', placeholder: L.ph.token, 'aria-label': L.ph.token,
    autocomplete: 'current-password', autocapitalize: 'off', spellcheck: 'false' });
  const btn = h('button', { class: 'btn primary', type: 'submit' }, L.btn.login);
  const form = h('form', { class: 'login-card', onsubmit: async e => {
    e.preventDefault();
    const token = inp.value.trim();
    if (!token || btn.disabled) return;
    btn.disabled = true;
    try { await post(BASE + 'api/login', { token }); finishLogin(); }
    catch (err) { toast(err.status === 401 ? L.msg.badToken : err.message, true); inp.select(); }
    btn.disabled = false;
  } }, h('div', { class: 'logo' }, svg(ICON.lock)), h('h1', null, L.login.title), inp, btn);
  $('#login').replaceChildren(form);
  $('#login').classList.remove('hidden');
  document.body.classList.add('locked');
  setTimeout(() => inp.focus(), 50);
}
function finishLogin() {
  S.auth = false; S.tried = {};
  $('#login').classList.add('hidden'); $('#login').replaceChildren();
  document.body.classList.remove('locked');
  resetHist(S.hist.kind);
  refresh().then(loadWs);
}
async function logout() {
  try { await post(BASE + 'api/logout', {}); } catch (e) { if (e.status === 401) return; }
  needLogin();
}

// ---------- attachment viewer ----------
function openLb(list, i) { S.lb = { list, i: Math.max(0, i) }; paintLb(); $('#lb').classList.add('open'); }
function closeLb() { $('#lb').classList.remove('open'); $('#lb').replaceChildren(); }
function lbStep(n) { const len = S.lb.list.length; if (len < 2) return; S.lb.i = (S.lb.i + n + len) % len; paintLb(); }
function paintLb() {
  const { list, i } = S.lb, p = list[i], many = list.length > 1;
  $('#lb').replaceChildren(
    h('div', { class: 'lh' }, h('span', { class: 'cnt' }, `${i + 1} / ${list.length}`),
      h('button', { class: 'x', type: 'button', 'aria-label': L.btn.close, onclick: closeLb }, svg(ICON.close))),
    h('div', { class: 'stage', onclick: e => { if (e.target === e.currentTarget) closeLb(); } },
      many ? h('button', { class: 'nav p', type: 'button', 'aria-label': L.btn.prev, onclick: () => lbStep(-1) }, svg(ICON.prev)) : null,
      h('img', { src: fileUrl(p), alt: fname(p) }),
      many ? h('button', { class: 'nav n', type: 'button', 'aria-label': L.btn.next, onclick: () => lbStep(1) }, svg(ICON.next)) : null),
    h('div', { class: 'lf' }, h('span', { class: 'nm' }, fname(p)), h('a', { href: fileUrl(p), target: '_blank', rel: 'noopener' }, L.btn.open)));
}

// ---------- extensions ----------
// A workspace extends this board from .tower/: the server reports extensions.{css,js} in api/state and serves the
// files at x/<path>, its routes at api/x/<name>. After the first state load the board adds x/extra.css and
// x/extra.js (once); extra.js talks to the board only through window.dah:
//   dah.addSection(tab, id, render)  tab: 'hub' | 'lanes' | 'history'; painted after that tab's own sections
//   dah.addTab(id, label, icon, render)  a nav tab after the built-in ones, opened at #x-<id>
//   dah.onState(fn)  fn(state) after every state load (and once right after registering)
// render(state) returns a Node, a string (shown as text), an array of those, or null. The board calls it on every
// render of a visible tab and repaints only when its output changed, so an unchanged section keeps its scroll, focus
// and typed text. Return the same Node again to keep it mounted and update it yourself. A callback that throws gets
// a small error box there; the rest of the board carries on.
const X_ID = /^[A-Za-z0-9_-]+$/, X_VIEW = /^x-[A-Za-z0-9_-]+$/;
function xTab(view) { return X_VIEW.test(view) ? X.tabs.get(view.slice(2)) || null : null; }
function xBad(msg) { console.error('[dah] ' + msg); return false; }
function xLabel(label, id) {
  if (typeof label === 'string' && label) return label;
  if (label && typeof label === 'object') return label[LANG] || label.en || Object.values(label).find(v => typeof v === 'string') || id;
  return id;
}
function xIcon(icon) {
  if (icon && icon.nodeType) return icon.cloneNode(true);
  return svg(typeof icon === 'string' && icon.trim() ? icon : ICON.ext);
}
// What a render returned, as text: equal text means equal output, so the painted DOM can stay.
function xKey(x) {
  if (x === null || x === undefined || x === false || x === '') return '';
  if (Array.isArray(x)) return x.map(xKey).join('\u0001');
  if (x.nodeType === 1) return '<' + x.outerHTML;
  if (x.nodeType === 11) return xKey([...x.childNodes]);
  if (x.nodeType) return '#' + x.textContent;
  return '"' + String(x);
}
function xErr(name, msg) {
  return h('section', { class: 'sec' }, h('div', { class: 'x-err', role: 'alert' },
    h('div', { class: 'k' }, svg(ICON.warn, 'ico'), L.x.err), h('div', { class: 'tx' }, `${name} · ${msg}`)));
}
function xPaint(el, name, fn) {
  try {
    const out = fn(S.data);
    if (out && out.nodeType && el.childNodes.length === 1 && el.firstChild === out) el._k = null;  // kept mounted by the extension
    else paint(el, '=' + xKey(out), () => out);
    el._xe = '';
  } catch (e) {
    const msg = String((e && e.message) || e || 'Error');
    if (el._xe !== msg) { el._xe = msg; console.error(`[dah] extension "${name}" failed:`, e); }  // once per new error, not every poll
    paint(el, '!' + LANG + msg, () => xErr(name, msg));
  }
}
function xSections(tab, v) {
  const reg = X.secs[tab];
  if (!reg || !reg.size) return;
  const slot = v._xs || (v._xs = h('div', { class: 'x-slot' }));
  if (v.lastChild !== slot) v.append(slot);  // after the tab's own sections, also once its shell was rebuilt
  let i = 0;
  for (const r of reg.values()) {
    if (slot.children[i] !== r.el) slot.insertBefore(r.el, slot.children[i] || null);
    xPaint(r.el, r.id, r.render);
    i++;
  }
}
// Registrations re-render once, after the current script turn.
function xQueue() {
  if (X.queued) return;
  X.queued = true;
  setTimeout(() => {
    X.queued = false;
    render();
    if (S.data) for (const fn of X.fresh.splice(0)) xCall(fn);
  }, 0);
}
function xCall(fn) {
  try { fn(S.data); } catch (e) { console.error('[dah] onState callback failed:', e); }
}
function xReady() { X.ready = true; xQueue(); }
function xStart(ext) {
  if (X.started) return;
  X.started = true;
  ext = ext || {};
  if (ext.css) document.head.append(h('link', { rel: 'stylesheet', href: BASE + 'x/extra.css' }));
  if (!ext.js) { xReady(); return; }
  document.body.append(h('script', { src: BASE + 'x/extra.js', onload: xReady,
    onerror: () => { console.error('[dah] could not load ' + BASE + 'x/extra.js'); xReady(); } }));
}
function xLoaded() {
  xStart(S.data && S.data.extensions);
  for (const fn of X.states) xCall(fn);
}
function addSection(tab, id, fn) {
  if (!TABS.includes(tab)) return xBad(`addSection: unknown tab ${JSON.stringify(tab)}; use one of ${TABS.join(', ')}`);
  if (typeof id !== 'string' || !id) return xBad('addSection: id must be a non-empty string');
  if (typeof fn !== 'function') return xBad(`addSection(${JSON.stringify(id)}): render must be a function`);
  const reg = X.secs[tab] || (X.secs[tab] = new Map()), old = reg.get(id);
  reg.set(id, { id, render: fn, el: old ? old.el : h('div', { 'data-x': id }) });
  xQueue();
  return true;
}
function addTab(id, label, icon, fn) {
  if (typeof icon === 'function' && fn === undefined) { fn = icon; icon = null; }
  if (typeof id !== 'string' || !X_ID.test(id)) return xBad(`addTab: id ${JSON.stringify(id)} must be letters, numbers, - and _`);
  if (typeof fn !== 'function') return xBad(`addTab(${JSON.stringify(id)}): render must be a function`);
  const old = X.tabs.get(id);
  X.tabs.set(id, { id, label, icon, render: fn, el: old ? old.el : $('main').appendChild(h('section', { class: 'hidden', 'data-x-tab': id })) });
  X.gen++;
  xQueue();
  return true;
}
function onState(fn) {
  if (typeof fn !== 'function') return xBad('onState: fn must be a function');
  X.states.push(fn); X.fresh.push(fn);
  xQueue();
  return true;
}
// Paths are relative to this workspace's board: dah.get('api/x/stats') → <BASE>/api/x/stats.
const xUrl = p => BASE + String(p || '').replace(/^\/+/, '');
window.dah = {
  get version() { return (S.data && S.data.version) || ''; },
  BASE: BASE.replace(/\/$/, ''),
  get lang() { return LANG; },
  get L() { return L; },
  get S() { return S; },
  h, svg, sec, empty, toast,
  get: path => get(xUrl(path)),
  post: (path, body) => post(xUrl(path), body),
  refresh: () => refresh(),
  addSection, addTab, onState,
};

// ---------- events + start ----------
(() => {
  const lb = $('#lb'); let x0 = null, y0 = null;
  lb.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  lb.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null;
    if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.5) lbStep(dx < 0 ? 1 : -1);
  }, { passive: true });
  document.addEventListener('keydown', e => {
    if (lb.classList.contains('open')) {
      if (e.key === 'Escape') closeLb(); else if (e.key === 'ArrowRight') lbStep(1); else if (e.key === 'ArrowLeft') lbStep(-1);
      return;
    }
    const typing = document.activeElement && /TEXTAREA|INPUT/.test(document.activeElement.tagName);
    if (e.key === 'Escape' && (S.item !== null || S.lane || S.menu) && !typing) closeSheet();
  });
  $('#sheet-bd').addEventListener('click', closeSheet);
  $('#signout').addEventListener('click', logout);
  $('#langbtn').addEventListener('click', () => openMenu('lang'));
  window.addEventListener('hashchange', route);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) load(); });
  setInterval(() => { if (!document.hidden) load(); }, POLL_MS);
  setInterval(() => { if (!document.hidden) loadWs(); }, WS_MS);
})();
initChat();
setLang(pickLang(''));
route();
load().then(loadWs);
</script>
