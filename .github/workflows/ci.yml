name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Install the wheel and run dah
        shell: bash
        run: |
          python -m pip install --quiet build
          python -m build --wheel --outdir dist
          VENV="$RUNNER_TEMP/dah-venv"
          python -m venv "$VENV"
          BIN="$VENV/bin"; [ -d "$BIN" ] || BIN="$VENV/Scripts"  # Scripts on Windows
          "$BIN/python" -m pip install --quiet dist/*.whl
          "$BIN/dah" -h > /dev/null
          "$BIN/dah" guide > /dev/null
          WS="$RUNNER_TEMP/ws"; mkdir -p "$WS"; cd "$WS"
          export AGENT_HUB_HOME="$RUNNER_TEMP/reg"
          "$BIN/dah" init --name CI --lang ko --hub claude --infra claude
          "$BIN/dah" --as hub goal add "첫 목표"
          "$BIN/dah" status
