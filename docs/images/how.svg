<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 312" width="880" height="312" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">How agent-hub works</title>
  <desc id="d">Five steps: you set goals; the hub plans the steps with you; tasks go to lanes, each in a fresh session; lanes work, call their own subagents and report back; the hub reviews and you decide only what needs a human. Goal progress shows on the board from 0 to 100 percent.</desc>
  <defs>
    <linearGradient id="pg" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#9be3c2"/><stop offset="1" stop-color="#03b26c"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="879" height="311" rx="20" fill="#f9fafb" stroke="#e5e8eb"/>
  <text x="24" y="38" font-size="18" font-weight="700" fill="#191f28">How it works</text>

  <g font-size="13" fill="#191f28">
    <!-- 1 -->
    <rect x="24" y="56" width="156" height="152" rx="16" fill="#ffffff" stroke="#e5e8eb"/>
    <circle cx="48" cy="80" r="12" fill="#3182f6"/><text x="48" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
    <rect x="128" y="70" width="26" height="42" rx="6" fill="none" stroke="#3182f6" stroke-width="2"/>
    <rect x="133" y="80" width="16" height="4" rx="2" fill="#03b26c"/><rect x="133" y="90" width="11" height="4" rx="2" fill="#03b26c"/>
    <text x="38" y="150" font-weight="700">You set goals</text>
    <text x="38" y="170" fill="#4e5968">and rank them</text>
    <text x="38" y="190" fill="#4e5968">on the board</text>

    <!-- 2 -->
    <rect x="192" y="56" width="156" height="152" rx="16" fill="#ffffff" stroke="#e5e8eb"/>
    <circle cx="216" cy="80" r="12" fill="#3182f6"/><text x="216" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
    <g stroke="#3182f6" stroke-width="2" stroke-linecap="round" fill="none">
      <path d="M296 76 l4 4 7-8"/><path d="M314 77 h16"/>
      <path d="M296 92 l4 4 7-8"/><path d="M314 93 h16"/>
      <rect x="296" y="103" width="10" height="10" rx="2"/><path d="M314 109 h16"/>
    </g>
    <text x="206" y="150" font-weight="700">Hub plans</text>
    <text x="206" y="170" fill="#4e5968">the steps with you</text>
    <text x="206" y="190" fill="#4e5968">(you approve them)</text>

    <!-- 3 -->
    <rect x="360" y="56" width="156" height="152" rx="16" fill="#ffffff" stroke="#e5e8eb"/>
    <circle cx="384" cy="80" r="12" fill="#3182f6"/><text x="384" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
    <g stroke="#3182f6" stroke-width="2" fill="none" stroke-linecap="round">
      <circle cx="458" cy="92" r="7" fill="#3182f6"/>
      <path d="M465 88 L486 74"/><path d="M466 92 L486 92"/><path d="M465 96 L486 110"/>
    </g>
    <rect x="486" y="68" width="14" height="12" rx="3" fill="#e8f3ff" stroke="#3182f6"/>
    <rect x="486" y="86" width="14" height="12" rx="3" fill="#e8f3ff" stroke="#3182f6"/>
    <rect x="486" y="104" width="14" height="12" rx="3" fill="#e8f3ff" stroke="#3182f6"/>
    <text x="374" y="150" font-weight="700">Tasks go to lanes</text>
    <text x="374" y="170" fill="#4e5968">a fresh session</text>
    <text x="374" y="190" fill="#4e5968">for each task</text>

    <!-- 4 -->
    <rect x="528" y="56" width="156" height="152" rx="16" fill="#ffffff" stroke="#e5e8eb"/>
    <circle cx="552" cy="80" r="12" fill="#3182f6"/><text x="552" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text>
    <rect x="622" y="70" width="38" height="26" rx="6" fill="#e8f3ff" stroke="#3182f6"/>
    <g fill="#8bb8f8"><circle cx="628" cy="108" r="4"/><circle cx="641" cy="112" r="4"/><circle cx="654" cy="108" r="4"/></g>
    <g stroke="#8bb8f8" stroke-width="1.5"><path d="M632 96 L628 104"/><path d="M641 96 L641 108"/><path d="M650 96 L654 104"/></g>
    <text x="542" y="150" font-weight="700">Lanes work alone</text>
    <text x="542" y="170" fill="#4e5968">call their subagents,</text>
    <text x="542" y="190" fill="#4e5968">report back</text>

    <!-- 5 -->
    <rect x="696" y="56" width="156" height="152" rx="16" fill="#ffffff" stroke="#e5e8eb"/>
    <circle cx="720" cy="80" r="12" fill="#3182f6"/><text x="720" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">5</text>
    <circle cx="812" cy="92" r="18" fill="#f0faf6" stroke="#03b26c" stroke-width="2"/>
    <path d="M803 92 l6 6 12-13" stroke="#03b26c" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="710" y="150" font-weight="700">Hub reviews</text>
    <text x="710" y="170" fill="#4e5968">you decide only what</text>
    <text x="710" y="190" fill="#4e5968">needs a human</text>
  </g>

  <g fill="#b0b8c1">
    <path d="M182 128 l8 4 -8 4 z"/><path d="M350 128 l8 4 -8 4 z"/><path d="M518 128 l8 4 -8 4 z"/><path d="M686 128 l8 4 -8 4 z"/>
  </g>

  <text x="24" y="242" font-size="13" font-weight="600" fill="#4e5968">Progress shows on the board as each goal's steps are done</text>
  <rect x="24" y="252" width="828" height="10" rx="5" fill="#e5e8eb"/>
  <rect x="24" y="252" width="828" height="10" rx="5" fill="url(#pg)"/>
  <text x="24" y="280" font-size="12" font-weight="700" fill="#4e5968">0%</text>
  <text x="852" y="280" text-anchor="end" font-size="12" font-weight="700" fill="#028a54">100%</text>
  <text x="440" y="298" text-anchor="middle" font-size="12" fill="#8b95a1">Works with OpenCode, Claude Code and Codex: your own agents, skills, MCP servers and hooks.</text>
</svg>
